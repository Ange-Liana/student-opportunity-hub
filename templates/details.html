<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ job.title }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<div class="container">


    <a href="/search?query={{ query }}">
        ← Back to Results
    </a>


    <div class="job-card">


        {% if job.logo %}

        <img
            src="{{ job.logo }}"
            class="company-logo"
        >

        {% endif %}


        <h1>

            {{ job.title }}

        </h1>


        <h3>

            {{ job.company }}

        </h3>


        <p>

            📍 {{ job.location }}

        </p>


        <hr>


        <p>

            {{ job.description }}

        </p>


        <a
            href="{{ job.apply_link }}"
            class="apply-btn"
            target="_blank"
        >

            Apply Now

        </a>


    </div>


</div>


</body>

</html>
