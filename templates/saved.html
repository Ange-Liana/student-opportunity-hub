<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saved Jobs</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>
Saved Opportunities
</h1>

{% if jobs %}

{% for job in jobs %}

<div class="job-card">

<h2>
{{ job.title }}
</h2>

<p>
{{ job.company }}
</p>

<p>
<strong>Location:</strong> {{ job.location }}
</p>

<a
href="{{ job.apply_link }}"
target="_blank"
class="apply-btn"
>
Apply Now
</a>

<a
href="{{ url_for('remove_saved_job', index=loop.index0) }}"
class="apply-btn"
style="background:#b22222;margin-left:10px;"
>
Remove
</a>

</div>

{% endfor %}

{% else %}

<div class="message">

No saved opportunities yet.

</div>

{% endif %}

</div>

</body>

</html>
